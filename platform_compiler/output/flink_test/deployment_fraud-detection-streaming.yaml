apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: fraud-detection-streaming
  namespace: flink-jobs
spec:
  image: registry.company.com/flink-python:1.17
  flinkVersion: v1_17
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "32"
    state.backend: rocksdb
    state.checkpoints.dir: "s3://company-data/checkpoints/flink-fraud/"
    execution.checkpointing.interval: "60sms"
  serviceAccount: flink-runner
  jobManager:
    resource:
      memory: 4g
      cpu: 4
  taskManager:
    resource:
      memory: 8g
      cpu: 4
  job:
    jarURI: local:///opt/flink/usrlib/fraud-detection-streaming.jar
    parallelism: 32
    upgradeMode: stateless
