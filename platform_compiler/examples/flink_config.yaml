# Конфигурация для Flink + Kubernetes

meta:
  name: streaming_pipeline
  version: "2.0.0"
  owner: streaming-team
  description: "Стриминговый пайплайн для обработки событий"

target:
  platform: flink
  mode: streaming

execution:
  parallelism: 3
  memory:
    jobmanager: "2048m"
    taskmanager: "4096m"
  cpu:
    cores: 2
  checkpointing:
    enabled: true
    interval: "60000"
    backend: rocksdb
    path: s3://checkpoints/flink
    num_retained: 3

orchestration:
  type: kubernetes
  namespace: flink-jobs
  service_account: flink
  image: flink:1.17
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

connectors:
  sources:
    - name: users
      type: kafka
      config:
        bootstrap_servers:
          - kafka-broker-1:9092
          - kafka-broker-2:9092
        topic: users-topic
        format: json
        scan_startup_mode: latest-offset
    - name: clicks
      type: kafka
      config:
        bootstrap_servers:
          - kafka-broker-1:9092
          - kafka-broker-2:9092
        topic: clicks-topic
        format: json
  sinks:
    - name: user_activity
      type: kafka
      semantics: exactly_once
      config:
        bootstrap_servers:
          - kafka-broker-1:9092
          - kafka-broker-2:9092
        topic: output-user-activity
        format: json
