# Flink Streaming + Kubernetes Configuration
# For real-time fraud detection

meta:
  name: "fraud-detection-streaming"
  version: "1.0.0"
  owner: "data-engineering-team"
  description: "Real-time fraud detection on Kafka streams"

target:
  platform: flink
  mode: streaming

execution:
  parallelism: 32
  checkpointing:
    enabled: true
    interval: "60s"
    backend: rocksdb
    path: "s3://company-data/checkpoints/flink-fraud/"
    num_retained: 3
  memory:
    jobmanager: "4g"
    taskmanager: "8g"
  cpu:
    cores: 4

connectors:
  sources:
    - name: raw_events
      type: kafka
      config:
        bootstrap_servers:
          - "kafka-broker-1.prod.internal:9092"
          - "kafka-broker-2.prod.internal:9092"
          - "kafka-broker-3.prod.internal:9092"
        topic: "transactions-prod"
        format: json
        scan_startup_mode: latest-offset
    
    - name: historical_transactions
      type: hdfs
      config:
        path: "s3://company-data/historical/transactions/"
        format: parquet
    
    - name: merchant_risk
      type: hdfs
      config:
        path: "s3://company-data/static/merchant_risk/"
        format: parquet

  sinks:
    - name: fraud_alerts
      type: kafka
      semantics: exactly_once
      config:
        bootstrap_servers:
          - "kafka-broker-1.prod.internal:9092"
          - "kafka-broker-2.prod.internal:9092"
        topic: "fraud-alerts-prod"
        format: json
        sink_semantic: exactly-once
    
    - name: monitoring_output
      type: hdfs
      semantics: at_least_once
      config:
        path: "s3://company-data/monitoring/fraud-stats/"
        format: parquet

models:
  - name: fraud_detector
    runtime: python
    requirements:
      - "scikit-learn==1.3.0"
      - "numpy==1.24.0"
      - "joblib==1.3.0"
    cache_policy: eager_load
    storage_path: "s3://company-models/fraud_detector_v2.pkl"
  
  - name: user_embedder
    runtime: python
    requirements:
      - "onnxruntime==1.15.0"
      - "numpy==1.24.0"
    cache_policy: lazy_load
    storage_path: "s3://company-models/user_encoder.onnx"

orchestration:
  type: kubernetes
  namespace: "flink-jobs"
  service_account: "flink-runner"
  image: "registry.company.com/flink-python:1.17"
  crd_type: FlinkDeployment
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
  env_vars:
    AWS_REGION: "us-east-1"
    LOG_LEVEL: "INFO"
