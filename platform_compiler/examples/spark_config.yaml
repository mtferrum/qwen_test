# Конфигурация для Spark + Airflow

meta:
  name: user_analytics
  version: "1.0.0"
  owner: data-engineering
  description: "Аналитика пользовательской активности"

target:
  platform: spark
  mode: batch

execution:
  parallelism: 4
  memory:
    driver: "2g"
    executor: "4g"
  cpu:
    cores: 2

orchestration:
  type: airflow
  schedule_interval: "@daily"
  start_date: "2024-01-01"
  catchup: false
  retries: 2

connectors:
  sources:
    - name: users
      type: hdfs
      config:
        path: /data/users
        format: parquet
    - name: clicks
      type: kafka
      config:
        bootstrap_servers:
          - kafka-broker-1:9092
          - kafka-broker-2:9092
        topic: clicks-topic
        format: json
  sinks:
    - name: user_activity
      type: hdfs
      config:
        path: /output/user_activity
        format: parquet
        partition_by:
          - date
