# Spark Batch + Airflow Configuration
# For nightly fraud detection recalculation

meta:
  name: "fraud-detection-batch"
  version: "1.0.0"
  owner: "data-engineering-team"
  description: "Nightly batch fraud detection pipeline"

target:
  platform: spark
  mode: batch

execution:
  parallelism: 50
  memory:
    driver: "8g"
    executor: "16g"
  cpu:
    cores: 4

connectors:
  sources:
    - name: raw_events
      type: hdfs
      config:
        path: "hdfs:///data/raw_events/parquet/"
        format: parquet
        partition_by: ["year", "month", "day"]
    
    - name: historical_transactions
      type: hdfs
      config:
        path: "hdfs:///data/historical_transactions/"
        format: parquet
    
    - name: merchant_risk
      type: hdfs
      config:
        path: "hdfs:///data/merchant_risk/"
        format: parquet

  sinks:
    - name: fraud_alerts
      type: hdfs
      semantics: at_least_once
      config:
        path: "hdfs:///data/fraud_alerts/output/"
        format: parquet
        overwrite: true
    
    - name: monitoring_output
      type: hdfs
      semantics: at_least_once
      config:
        path: "hdfs:///data/monitoring/stats/"
        format: parquet

models:
  - name: fraud_detector
    runtime: python
    requirements:
      - "scikit-learn==1.3.0"
      - "numpy==1.24.0"
      - "pandas==2.0.0"
    cache_policy: eager_load
    storage_path: "hdfs:///models/fraud_detector_v2.pkl"
  
  - name: user_embedder
    runtime: python
    requirements:
      - "onnxruntime==1.15.0"
      - "numpy==1.24.0"
    cache_policy: lazy_load
    storage_path: "hdfs:///models/user_encoder.onnx"

orchestration:
  type: airflow
  schedule_interval: "0 2 * * *"  # Daily at 2 AM
  start_date: "2024-01-01"
  catchup: false
  retries: 2
  retry_delay: "5m"
  operator_config:
    conf:
      spark.sql.adaptive.enabled: "true"
      spark.sql.shuffle.partitions: "200"
